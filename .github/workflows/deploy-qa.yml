name: Deploy → QA

on:
  push:
    branches: [release/qa]

jobs:
  deploy:
    name: aivartha → qa.paisabot.com
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Deploy
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py qa

      - name: Done
        run: echo "✅ Deployed to qa.paisabot.com (commit ${{ github.sha }})"
