name: Deploy → Production

on:
  push:
    branches: [release/production]

# NOTE: the apex paisabot.com (FTP user u928714162, the main hosting account)
# is intentionally NOT deployed here — that account's FTP login times out, so
# this job used to fail on the first step and skip every other site. The apex
# is deployed via the Hostinger API (hosting_deployWordpressTheme) instead.
# Only the addon-domain sub-accounts (hi/ml/tel) deploy reliably over FTP.

jobs:
  deploy:
    name: Deploy all production sites
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # Each site is independent: if: always() keeps one site's failure from
      # skipping the others, and the job still fails if any site fails.
      - name: hi.paisabot.com
        if: ${{ always() }}
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py hi

      - name: ml.paisabot.com
        if: ${{ always() }}
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py ml

      - name: tel.paisabot.com
        if: ${{ always() }}
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py tel

      # Extended Indic sites — use main FTP account (u928714162) with base paths.
      # These were re-created as subdomains of paisabot.com so they share the
      # main account's FTP credentials (same password as hi/ml/tel).
      - name: ta.paisabot.com
        if: ${{ always() }}
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py ta

      - name: mr.paisabot.com
        if: ${{ always() }}
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py mr

      - name: gu.paisabot.com
        if: ${{ always() }}
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py gu

      - name: kn.paisabot.com
        if: ${{ always() }}
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py kn

      - name: bn.paisabot.com
        if: ${{ always() }}
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py bn

      - name: or.paisabot.com
        if: ${{ always() }}
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py or

      - name: Done
        run: echo "✅ All 9 production sites deployed (commit ${{ github.sha }}). Apex paisabot.com deploys via Hostinger API."
