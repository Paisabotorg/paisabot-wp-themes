name: Deploy → Production

on:
  push:
    branches: [release/production]

jobs:
  deploy:
    name: Deploy aivartha to all production sites
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: paisabot.com (aivartha)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py paisabot

      - name: hi.paisabot.com (aivartha)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py hi

      - name: ml.paisabot.com (aivartha)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py ml

      - name: tel.paisabot.com (aivartha)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python deploy.py tel

      - name: Done
        run: echo "✅ All 4 production sites deployed with aivartha theme (commit ${{ github.sha }})"
